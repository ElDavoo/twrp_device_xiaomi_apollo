name: Build YARP recovery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (leave empty to only build)"
        required: false
        default: ""
      lineage_zip_url:
        description: "LineageOS apollon OTA to take vendor blobs from (empty = latest nightly)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  MANIFEST_URL: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-16.0
  LUNCH_TARGET: twrp_apollo-bp2a-eng
  CCACHE_DIR: ${{ github.workspace }}/ccache
  CCACHE_MAXSIZE: 8G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Current ubuntu-24.04 runners have one 145 GB root disk and no separate /mnt
      # disk, so maximize-build-space's LVM trick fills the root disk. Just delete
      # the preinstalled toolchains we don't need and build on the root disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia* \
            /usr/local/share/powershell /usr/share/miniconda /opt/az /usr/local/aws-cli \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/lib/jvm
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo swapoff -a; sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile
          free -m; df -h /

      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: src/device/xiaomi/apollo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache curl flex fontconfig git gnupg gperf \
            libc6-dev-i386 libgl1-mesa-dev libx11-dev libxml2-utils lib32z1-dev \
            python3 rsync unzip xsltproc zip zlib1g-dev brotli erofs-utils
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          df -h / "$GITHUB_WORKSPACE"

      - name: Pick LineageOS OTA for vendor blobs
        id: ota
        run: |
          if [ -n "${{ inputs.lineage_zip_url }}" ]; then
            url="${{ inputs.lineage_zip_url }}"; sha=""
          else
            read -r url sha < <(curl -fsSL https://download.lineageos.org/api/v2/devices/apollon/builds |
              python3 -c 'import json,sys; f=json.load(sys.stdin)[0]["files"][0]; print(f["url"], f["sha256"])')
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$url")" >> "$GITHUB_OUTPUT"
          echo "Vendor blobs from: $url"

      - name: Restore vendor blobs cache
        id: blobs-cache
        uses: actions/cache@v4
        with:
          path: src/device/xiaomi/apollo/recovery/root/vendor
          key: blobs-${{ steps.ota.outputs.name }}-${{ hashFiles('src/device/xiaomi/apollo/tools/extract_blobs.sh') }}

      - name: Extract vendor blobs from the OTA
        if: steps.blobs-cache.outputs.cache-hit != 'true'
        run: |
          # Work on the big build volume; the root disk only keeps ccache and swap.
          ota="$GITHUB_WORKSPACE/ota-tmp"
          mkdir -p "$ota"
          curl -fL --retry 3 -o "$ota/rom.zip" "${{ steps.ota.outputs.url }}"
          if [ -n "${{ steps.ota.outputs.sha256 }}" ]; then
            echo "${{ steps.ota.outputs.sha256 }}  $ota/rom.zip" | sha256sum -c -
          fi
          src/device/xiaomi/apollo/tools/blobs_from_ota.sh "$ota/rom.zip" "$ota/work"
          rm -rf "$ota"
          df -h / .

      - name: Sync YARP sources
        working-directory: src
        run: |
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --no-clone-bundle
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j"$(nproc --all)" ||
            repo sync -c --no-tags --no-clone-bundle -j4
          repo manifest -r -o "$GITHUB_WORKSPACE/manifest-pinned.xml"
          df -h .

      - name: Apply source patches
        working-directory: src
        run: |
          git -C bootable/recovery am "$PWD"/device/xiaomi/apollo/patches/bootable_recovery/*.patch
          git -C system/vold      am "$PWD"/device/xiaomi/apollo/patches/system_vold/*.patch
          git -C bootable/recovery log --oneline -6
          # The build does not need git history; free the space.
          rm -rf .repo
          df -h .

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.LUNCH_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}-0
          restore-keys: ccache-${{ env.LUNCH_TARGET }}-

      - name: Prepare build
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep the runner agent alive under memory pressure: let the kernel kill a
          # compiler instead (a killed agent loses the whole job and its logs).
          for p in $(pgrep -f 'Runner.(Listener|Worker)'); do echo -1000 | sudo tee /proc/$p/oom_score_adj >/dev/null; done
          # Log memory/disk every minute so a dying runner leaves a trace.
          # Also upload it to a draft release every 2 minutes, because the job log is
          # lost if the runner dies (seen twice ~48 min into the build).
          gh release view ci-diagnostics >/dev/null 2>&1 ||
            gh release create ci-diagnostics --draft --title "CI diagnostics" --notes "Resource log of the last CI build" || true
          cat > "$RUNNER_TEMP/mon.sh" <<'SH'
          #!/bin/bash
          n=0
          while sleep 60; do
            {
              echo "=== $(date +%T)"
              free -m | sed -n 2,3p
              df -h / "$1" | tail -2
              du -sh "$CCACHE_DIR" "$1/out" /tmp 2>/dev/null | tr '\n' ' '; echo
              ps -eo rss,pcpu,comm --sort=-rss | head -6
              sudo dmesg | grep -iE "oom|killed|out of memory|no space" | tail -3
            } >> "$GITHUB_WORKSPACE/monitor.log" 2>&1
            n=$((n + 1))
            [ $((n % 2)) -eq 0 ] && tail -c 200000 "$GITHUB_WORKSPACE/monitor.log" > "$RUNNER_TEMP/monitor-tail.log" &&
              gh release upload ci-diagnostics "$RUNNER_TEMP/monitor-tail.log" --clobber >/dev/null 2>&1
          done
          SH
          nohup bash "$RUNNER_TEMP/mon.sh" "$PWD" >/dev/null 2>&1 &
          cat > ci-build.sh <<'SH'
          #!/bin/bash
          # usage: ci-build.sh <minutes>
          export USE_CCACHE=1 CCACHE_EXEC=/usr/bin/ccache CC_WRAPPER=/usr/bin/ccache CXX_WRAPPER=/usr/bin/ccache
          export CCACHE_COMPILERCHECK=content CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true
          export CCACHE_SLOPPINESS=time_macros,file_macro,include_file_mtime,include_file_ctime
          export ALLOW_MISSING_DEPENDENCIES=true
          export TMPDIR="$GITHUB_WORKSPACE/tmp"; mkdir -p "$TMPDIR"
          set +e
          timeout --signal=INT "${1}m" nice -n 10 bash -c 'source build/envsetup.sh && lunch "$LUNCH_TARGET" && m -j3 recoveryimage'
          rc=$?
          ccache -s | head -20
          tail -25 "$GITHUB_WORKSPACE/monitor.log"
          exit $rc
          SH
          chmod +x ci-build.sh
          ccache -z

      # The build is split in two time-boxed parts so ccache is saved midway: if the
      # job dies or times out, the next run starts from that cache.
      - name: Build recovery image (part 1)
        id: build1
        continue-on-error: true
        working-directory: src
        run: ./ci-build.sh 120

      - name: Save ccache (part 1)
        if: always() && steps.build1.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.LUNCH_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}-1

      - name: Build recovery image (part 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        working-directory: src
        run: ./ci-build.sh 150

      - name: Save ccache (part 2)
        if: always() && steps.build2.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.LUNCH_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}-2

      - name: Show resource log
        if: always()
        run: cat monitor.log 2>/dev/null | tail -60 || true

      - name: Collect image
        id: img
        run: |
          img=src/out/target/product/apollo/recovery.img
          test -s "$img"
          name="yarp-${{ inputs.release_tag || format('ci-{0}', github.run_number) }}.img"
          mkdir -p dist
          cp "$img" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          cp manifest-pinned.xml dist/
          echo "Vendor blobs from ${{ steps.ota.outputs.name }}" > dist/blobs-source.txt
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.img.outputs.name }}
          path: dist/
          retention-days: 30

      - name: Publish release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"
          notes="device/xiaomi/apollo/release-notes/$tag.md"
          if [ -f "src/$notes" ]; then notes_arg=(-F "src/$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "YARP 3.7.1_16-0 for apollo — $tag" \
            "${notes_arg[@]}" "dist/${{ steps.img.outputs.name }}" "dist/${{ steps.img.outputs.name }}.sha256"
